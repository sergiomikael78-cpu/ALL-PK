<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Keyboard Frame -->
  <rect x="76" y="116" width="360" height="280" rx="36" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Keys Grid -->
  <!-- Row 1 -->
  <rect x="116" y="156" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="188" y="156" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="260" y="156" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="332" y="156" width="64" height="50" rx="12" fill="url(#cyanGrad)"/>
  
  <!-- Row 2 -->
  <rect x="116" y="226" width="64" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="196" y="226" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="268" y="226" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="340" y="226" width="56" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Spacebar -->
  <rect x="156" y="300" width="200" height="46" rx="14" fill="url(#cyanGrad)"/>
</svg>
